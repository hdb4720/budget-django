<!-- Budget Table -->
<div id="manager-table" class="container-fluid mt-4 px-3">
  <div class="table-responsive">
    <table class="table table-hover table-sm align-middle"
          style="min-width: 1200px; table-layout: fixed; font-variant-numeric: tabular-nums;">
      <colgroup>
        <col style="width: 15%">
        <col style="width: 7%">
        <col style="width: 7%">
        <col style="width: 7%">
        <col style="width: 7%">
        <col style="width: 7%">
        <col style="width: 7%">
        <col style="width: 7%">
        <col style="width: 6%">
      </colgroup>
      <thead class="table-light sticky-top text-nowrap">
        <tr>
          <th scope="col">
            <button 
              type="button" 
              class="btn btn-link p-0 text-reset text-decoration-none fw-semibold"
              hx-get="{% url 'budget-manager' %}" 
              hx-target="#manager-table" 
              hx-swap="outerHTML" 
              hx-vals='{
                "respond_to": "table",
                "sort_field": "category",
                "sort_direction": "{% if sorting.sort_field == 'category' and sorting.sort_direction == 'asc' %}desc{% else %}asc{% endif %}"
              }'              
              hx-include="[name='scheme'], [name='period'], [name='selected_date']">
              Category
              {% if sorting.sort_field == "category" %}
                {% if sorting.sort_direction == "asc" %}
                  <i class="fa-solid fa-arrow-up ms-1" aria-label="Ascending"></i>
                {% else %}
                  <i class="fa-solid fa-arrow-down ms-1" aria-label="Descending"></i>
                {% endif %}
              {% endif %}
            </button>
          </th>
          <th scope="col">
            <button 
              type="button" 
              class="btn btn-link p-0 text-reset text-decoration-none fw-semibold"
              hx-get="{% url 'budget-manager' %}" 
              hx-target="#manager-table" 
              hx-swap="outerHTML" 
              hx-vals='{
                "respond_to": "table",
                "sort_field": "type",
                "sort_direction": "{% if sorting.sort_field == 'type' and sorting.sort_direction == 'asc' %}desc{% else %}asc{% endif %}"
              }' 
              hx-include="[name='scheme'], [name='period'], [name='selected_date']"
            >
              Type
              {% if sorting.sort_field == "type" %}
                {% if sorting.sort_direction == "asc" %}
                  <i class="fa-solid fa-arrow-up ms-1" aria-label="Ascending"></i>
                {% else %}
                  <i class="fa-solid fa-arrow-down ms-1" aria-label="Descending"></i>
                {% endif %}
              {% endif %}
            </button>
          </th>
          <th scope="col">
            <button 
              type="button"

          <th scope="col" class="text-end">

            </button>

            </button>
          </th>

            <button

              hx-get="{% url 'budget-manager' %}"

          </th>
          <th scope="col" class="text-end">
            <button

          </th>
          <th scope="col">
            <span class="visually-hidden">
              Action
            </span>
          </th>
        </tr>
      </thead>
      <!-- Budget Rows -->
      <tbody id="manager-table-body">
        {% for item in manager %}
          {% include "budget/manager/_row.html" with item=item %}
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
