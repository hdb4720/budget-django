{% extends "base.html" %}

{% block content %}
<h1>Import Running</h1>

<p>Your import is running in the background.</p>

<div style="margin-top: 2em;">
    <progress id="progressbar" value="0" max="100" style="width: 100%; height: 25px;"></progress>
    <p id="progress-text" style="margin-top: 0.5em;">Starting…</p>
</div>

<script>
    function poll() {
        fetch("{% url 'import_progress' task_id %}")
            .then(response => response.json())
            .then(data => {
                const bar = document.getElementById("progressbar");
                const text = document.getElementById("progress-text");

                if (data.state === "PROGRESS") {
                    const percent = data.info.percent || 0;
                    const message = data.info.message || "";
                    bar.value = percent;
                    text.innerText = percent + "% — " + message;
                }

                if (data.state === "SUCCESS") {
                    bar.value = 100;
                    text.innerText = "Import complete";

                    // Redirect to results page
                    window.location.href = "{% url 'import_results' task_id %}";
                }

                if (data.state === "FAILURE") {
                    text.innerText = "Error: " + (data.info?.error || "Unknown error");
                    clearInterval(interval);
                }
            });
    }

    let interval = setInterval(poll, 1000);
</script>

{% endblock %}
