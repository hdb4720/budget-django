<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Budget System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .messages {
            margin-bottom: 1.5rem;
        }

        .messages .success {
            background: #d4edda;
            padding: 10px;
            border-left: 4px solid #28a745;
        }

        .messages .info {
            background: #d1ecf1;
            padding: 10px;
            border-left: 4px solid #17a2b8;
        }

        .messages .error {
            background: #f8d7da;
            padding: 10px;
            border-left: 4px solid #dc3545;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Django messages -->
        <div class="messages">
            {% if messages %}
            {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
        </div>

        <!-- Page content -->
        {% block content %}
        {% endblock %}

    </div>
</body>

</html>
